    <ellipse cx="0" cy="10" rx="15" ry="12.5" fill="#F4FBF7"/>
    <circle cx="-11" cy="-6" r="5.8" fill="#F4FBF7"/>
    <circle cx="-4" cy="-13" r="5.4" fill="#F4FBF7"/>
    <circle cx="5" cy="-13" r="5.4" fill="#F4FBF7"/>
    <circle cx="12" cy="-6" r="5.8" fill="#F4FBF7"/>
    <path d="M-4.2 10.5c0-2.3 1.9-4.1 4.2-4.1s4.2 1.8 4.2 4.1c0 1.9-1.3 3.1-2.8 4.1L0 16.2l-1.4-1.6c-1.5-1-2.8-2.2-2.8-4.1z" fill="#245C48" opacity="0.9"/>
    <circle cx="28" cy="-28" r="7" fill="#F2C66D"/>

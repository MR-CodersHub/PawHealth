<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" role="img" aria-labelledby="title desc">
  <title id="title">PawHealth</title>
  <desc id="desc">PawHealth veterinary clinic logo with the tagline Trusted Care for Every Paw</desc>
  <defs>
    <linearGradient id="pawBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#245C48"/>
      <stop offset="100%" stop-color="#286D73"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(60 60)">

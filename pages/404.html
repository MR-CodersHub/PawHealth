<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="404 Page Not Found — PawHealth Veterinary Clinic & Animal Hospital." />
  <title>404 — Page Gone for a Walk | PawHealth</title>

  <!-- Stylesheets -->
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="stylesheet" href="../css/error.css" />
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg" />
  <link rel="shortcut icon" href="../assets/favicon.svg" />
  <meta name="theme-color" content="#245C48" />
</head>
<body class="error-page-wrapper">

  <div class="error-card reveal-on-scroll">

    <!-- Veterinary Animal Illustration SVG -->
    <svg class="error-illustration" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="100" cy="100" r="90" fill="#DCEFE5" />
      <!-- Dog Silhouette searching with magnifying paw -->
      <path d="M70 120 C60 110, 60 90, 75 80 C85 70, 115 70, 125 80 C140 90, 140 110, 130 120 C120 130, 80 130, 70 120 Z" fill="#245C48" />
      <!-- Floppy ears -->
      <path d="M60 85 C50 95, 50 115, 62 110 C68 100, 70 90, 60 85 Z" fill="#1d5257" />
      <path d="M140 85 C150 95, 150 115, 138 110 C132 100, 130 90, 140 85 Z" fill="#1d5257" />
      <!-- Snout & Nose -->
      <ellipse cx="100" cy="105" rx="14" ry="10" fill="#FFF9F0" />
      <polygon points="100,102 94,97 106,97" fill="#27332F" />
      <!-- Cute Eyes -->
      <circle cx="85" cy="88" r="4" fill="#FFF9F0" />
      <circle cx="115" cy="88" r="4" fill="#FFF9F0" />
      <!-- Question mark in paw -->
      <text x="94" y="160" font-family="'Fraunces', serif" font-size="32" font-weight="bold" fill="#F28B78">?</text>
    </svg>

    <div class="error-code">404</div>
    <h1 class="error-title">Oops! This Page Has Gone for a Walk</h1>
    <p class="error-desc">
      We searched the entire clinic, checked all the examination suites, but the page you are looking for has wandered off. Let's get you back on the right path.
    </p>

    <div class="error-actions">
      <a href="../index.html" class="btn btn--primary btn--large">Back to Home</a>
      <a href="services.html" class="btn btn--outline-dark btn--large">Explore Services</a>
      <a href="contact.html" class="btn btn--outline-dark btn--large">Contact Clinic</a>
    </div>

    <div style="margin-top: var(--space-8); font-size: 0.8rem; color: var(--color-text-light);">
      Emergency line active 24/7: <a href="tel:+15551234568" style="color: var(--color-coral); font-weight: 700;">(555) 123-4568</a>
    </div>

  </div>

  <script src="../js/global.js" defer></script>
</body>
</html>
